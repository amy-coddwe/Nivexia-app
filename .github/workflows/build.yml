name: Build Nivexia APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup Custom Code & Generate Android Files
        run: |
          cp lib/main.dart main.dart.bak
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --platforms=android --org com.nivexia --project-name nivexia_ping .
          mv main.dart.bak lib/main.dart
          mv pubspec.yaml.bak pubspec.yaml

      - name: Unlock Native V2Ray Core & Permissions
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true
          echo "android.bundle.enableUncompressedNativeLibs=false" >> android/gradle.properties
          sed -i 's/android:label="nivexia_ping"/android:label="Nivexia"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:extractNativeLibs="[^"]*"//g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:extractNativeLibs="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Nivexia APK
        uses: actions/upload-artifact@v4
        with:
          name: Nivexia-Ping-APK
          path: build/app/outputs/flutter-apk/app-release.apk
